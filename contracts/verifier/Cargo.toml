[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "21"
# soroban-env-host 21.2.1's testutils feature only compiles against the
# ed25519-dalek 2.x line (rand_core 0.6); the resolver otherwise picks 3.x and
# fails on `SigningKey::generate(ChaCha20Rng)`. Pin it.
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = false
codegen-units = 1
